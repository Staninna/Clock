# Builds a signed production (release) APK and publishes it as a GitHub Release.
#
# Runs on every push to my-main (tagged automatically as v<versionName>-fork.<n>), when a tag
# starting with "v" is pushed, or manually from the Actions tab ("Run workflow").
# Add [skip ci] to a commit message to push to my-main without releasing.
#
# One-time setup: run the droidfork kit's signing-key.sh (~/.droidfork/scripts/signing-key.sh) in
# this repository. It creates or reuses the key in <keys folder>/Staninna__Clock/ and stores these
# repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    base64 of the release keystore (.jks):  base64 -w0 release.jks
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password
#
# Keep the keystore and passwords safe: every future update must be signed with the same key,
# otherwise Android refuses to install it over the existing app.

name: Release

on:
  push:
    # Every push to my-main publishes a new release (v<versionName>-fork.<n>).
    # Add [skip ci] to a commit message to push without releasing.
    branches:
      - my-main
    # A pushed v* tag releases exactly that tag.
    tags:
      - "v*"
    # Pushes that only change docs or store metadata don't need a new release.
    # (Path filters are ignored for tag pushes.)
    paths-ignore:
      - "**/*.md"
      - "fastlane/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (empty: next v<versionName>-fork.<n>)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# One release at a time, so automatic tag numbers never clash; later pushes wait in line.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. A production build must be signed; see the header of .github/workflows/release.yml."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: the legacy "tools" package no longer exists.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        env:
          # Optional: Client ID of your Spotify app, to enable "Log in with Spotify"
          # (https://developer.spotify.com/dashboard). Without it, users can paste their own.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ]; then
            echo "::warning::SPOTIFY_CLIENT_ID is not set: the Spotify login will ask users for their own Client ID."
          fi
          chmod +x gradlew
          ./gradlew --no-configuration-cache :app:assembleRelease

      - name: Remove signing config
        if: always()
        run: rm -f keystore.jks keystore.properties

      - name: Verify signature and collect APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/Clock_*-release.apk)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          version=$(grep -m1 -E "^\s*versionName\s*=" app/build.gradle | sed -E "s/.*=\s*['\"]([^'\"]+)['\"].*/\1/")
          sha256sum "$apk" | sed 's#  .*/#  #' > "$apk.sha256"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            # Automatic release (push to my-main or manual run without a tag).
            # Reuse a fork release tag already on this commit, otherwise take the next free number.
            # Only -fork.<n> tags count: forks also carry upstream's own tags (e.g. v1.2.0), and
            # the fork's build must never be published under one of those.
            git fetch --tags --force --quiet origin || true
            tag="$(git tag --points-at HEAD --list 'v*-fork.*' | head -n1)"
            if [ -z "$tag" ]; then
              n=1
              while git rev-parse -q --verify "refs/tags/v${VERSION}-fork.${n}" >/dev/null; do
                n=$((n + 1))
              done
              tag="v${VERSION}-fork.${n}"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clock-${{ steps.tag.outputs.tag }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Clock ${{ steps.tag.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
